<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Voisr Recording</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; overflow: hidden; }
  body {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .pill {
    width: 220px;
    height: 44px;
    background: rgba(28, 26, 23, 0.94);
    border-radius: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
  }
  .bar {
    width: 4px;
    height: 8px;
    border-radius: 2px;
    background: var(--bar-color, #FFFFFF);
    opacity: 0.9;
  }
  /* recording: staggered waveform */
  .pill[data-state="recording"] .bar { animation: wave 1s ease-in-out infinite; }
  .pill[data-state="recording"] .bar:nth-child(1) { animation-delay: 0s; }
  .pill[data-state="recording"] .bar:nth-child(2) { animation-delay: .15s; }
  .pill[data-state="recording"] .bar:nth-child(3) { animation-delay: .3s; }
  .pill[data-state="recording"] .bar:nth-child(4) { animation-delay: .45s; }
  .pill[data-state="recording"] .bar:nth-child(5) { animation-delay: .6s; }
  .pill[data-state="recording"] .bar:nth-child(6) { animation-delay: .75s; }
  .pill[data-state="recording"] .bar:nth-child(7) { animation-delay: .9s; }
  @keyframes wave {
    0%, 100% { height: 8px; }
    50% { height: 26px; }
  }
  /* processing: gentle uniform pulse */
  .pill[data-state="processing"] .bar { height: 14px; animation: throb 1.1s ease-in-out infinite; }
  @keyframes throb {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 0.9; }
  }
  /* done / error: swap bars for icon */
  .icon { display: none; }
  .pill[data-state="done"] .bar, .pill[data-state="error"] .bar { display: none; }
  .pill[data-state="done"] .icon-done { display: block; }
  .pill[data-state="error"] .icon-error { display: block; }
  .icon svg { width: 20px; height: 20px; display: block; }
  /* ---- themes ----------------------------------------------------------
     Color (and Scanner's dot shape) applies in ALL states — theme rules must
     stay AFTER the state rules above (equal specificity, source order
     decides); each theme's
     signature animation applies to the recording state only. Overrides use
     longhand animation-* properties so the nth-child stagger delays above
     keep applying (the shorthand would reset them). No data-theme attribute
     (or an unknown one) = Classic, purely by CSS fallthrough. */
  .pill[data-theme="ember"] .bar { background: var(--bar-color, #E8643C); box-shadow: 0 0 6px var(--bar-glow, rgba(232, 100, 60, .8)); }
  .pill[data-state="recording"][data-theme="ember"] .bar {
    animation-name: flick; animation-duration: .9s;
  }

  .pill[data-theme="aurora"] .bar { background: var(--bar-color, linear-gradient(180deg, #4ADEDE, #9B5DE5)); }
  .pill[data-state="recording"][data-theme="aurora"] .bar {
    animation-name: wave, hue; animation-duration: 1.1s, 3s;
    animation-timing-function: ease-in-out, linear;
  }
  /* a custom color must not drift through the spectrum: drop the hue-rotate
     animation while --bar-color is set (data-custom-color mirrors it) */
  .pill[data-custom-color][data-state="recording"][data-theme="aurora"] .bar {
    animation-name: wave; animation-duration: 1.1s;
    animation-timing-function: ease-in-out;
  }

  .pill[data-theme="ocean"] .bar { background: var(--bar-color, #5AA9E6); }
  .pill[data-state="recording"][data-theme="ocean"] .bar {
    animation-name: swell; animation-duration: 1.8s;
  }

  .pill[data-theme="neon"] .bar { background: var(--bar-color, #39FF88); box-shadow: 0 0 7px var(--bar-glow, rgba(57, 255, 136, .75)); }
  .pill[data-state="recording"][data-theme="neon"] .bar {
    animation-name: eq; animation-duration: .7s;
    animation-timing-function: steps(3, end);
  }

  .pill[data-theme="breathe"] .bar { background: var(--bar-color, #A8E6CF); }
  .pill[data-state="recording"][data-theme="breathe"] .bar {
    animation-name: breathe; animation-duration: 1.6s;
    animation-delay: 0s !important; /* one synchronized pulse, no stagger (defensive: ties with nth-child stagger rules on specificity) */
  }

  .pill[data-theme="scanner"] .bar {
    background: var(--bar-color, #EDEDED); width: 6px; height: 6px; border-radius: 3px; opacity: .18;
  }
  .pill[data-state="recording"][data-theme="scanner"] .bar {
    animation-name: scan; animation-duration: 1.2s;
    animation-timing-function: linear;
  }

  @keyframes flick   { 0%, 100% { height: 8px; } 35% { height: 24px; } 60% { height: 14px; } 80% { height: 22px; } }
  @keyframes hue     { from { filter: hue-rotate(0deg); } to { filter: hue-rotate(360deg); } }
  @keyframes swell   { 0%, 100% { height: 6px; opacity: .65; } 50% { height: 22px; opacity: 1; } }
  @keyframes eq      { 0% { height: 6px; } 25% { height: 24px; } 50% { height: 10px; } 75% { height: 20px; } 100% { height: 6px; } }
  @keyframes breathe { 0%, 100% { transform: scaleY(.5); opacity: .45; } 50% { transform: scaleY(1.4); opacity: 1; } }
  @keyframes scan    { 0%, 20% { opacity: 1; } 40%, 100% { opacity: .18; } }
  @media (prefers-reduced-motion: reduce) {
    .bar { animation: none !important; height: 14px !important; }
    /* scanner's resting opacity is animation-driven; restore visibility
       (and keep the dots dot-shaped rather than 14px capsules) */
    .pill[data-theme="scanner"] .bar { opacity: .9 !important; height: 6px !important; }
  }
</style>
</head>
<body>
  <div class="pill" id="pill" data-state="recording" role="status" aria-live="polite">
    <span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span>
    <span class="bar"></span><span class="bar"></span><span class="bar"></span>
    <span class="icon icon-done" aria-label="Dictation copied">
      <svg viewBox="0 0 24 24" fill="none" stroke="#7FD19A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    </span>
    <span class="icon icon-error" aria-label="Dictation failed">
      <svg viewBox="0 0 24 24" fill="none" stroke="#F08C72" stroke-width="3" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="14"/><circle cx="12" cy="19" r="1.4" fill="#F08C72" stroke="none"/></svg>
    </span>
  </div>
<script>
  "use strict";
  const pill = document.getElementById("pill");
  const bars = pill.querySelectorAll(".bar");

  /* Restart the CSS animation from frame 0.
     WebKit pauses a WKWebView's animations while its window is occluded —
     which is exactly what happens when the pill is ordered over another
     app's fullscreen Space — and does not reliably resume an already-running
     animation when the window becomes visible again, so the bars can appear
     frozen. Re-applying the animation guarantees it plays. */
  function kick() {
    for (const b of bars) b.style.animation = "none";
    void pill.offsetWidth;            // reflow so the removal takes effect
    for (const b of bars) b.style.animation = "";
  }

  function setState(state) {
    pill.dataset.state = state;
    kick();
  }
  window.setState = setState;

  const THEME_VALUES = ["classic", "ember", "aurora", "ocean", "neon", "breathe", "scanner"];
  function setTheme(theme) {
    /* classic/unknown = no attribute; base CSS renders the Classic look */
    if (THEME_VALUES.includes(theme) && theme !== "classic") pill.dataset.theme = theme;
    else delete pill.dataset.theme;
    kick();
  }
  window.setTheme = setTheme;

  const HEX_RE = /^#[0-9A-Fa-f]{6}$/;
  function setColor(hex) {
    /* null/invalid = theme's designed color (the CSS var() fallbacks) */
    if (typeof hex === "string" && HEX_RE.test(hex)) {
      pill.style.setProperty("--bar-color", hex);
      const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16),
            b = parseInt(hex.slice(5, 7), 16);
      pill.style.setProperty("--bar-glow", `rgba(${r}, ${g}, ${b}, .75)`);
      pill.dataset.customColor = "";
    } else {
      pill.style.removeProperty("--bar-color");
      pill.style.removeProperty("--bar-glow");
      delete pill.dataset.customColor;
    }
    kick();
  }
  window.setColor = setColor;

  const params = new URLSearchParams(location.search);

  /* browser QA: widget.html?theme=ember previews a theme */
  const qaTheme = params.get("theme");
  if (qaTheme) setTheme(qaTheme);

  /* browser QA: widget.html?theme=aurora&color=%23FF0080 previews a custom color */
  if (params.get("color")) setColor(params.get("color"));

  /* WebKit flips the page back to "visible" the moment the panel is shown
     over a fullscreen app — re-kick then so the waveform is never stuck at
     its first frame after appearing. */
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") kick();
  });

  /* browser QA: widget.html?preview cycles through all states */
  if (params.has("preview")) {
    const states = ["recording", "processing", "done", "error"];
    let i = 0;
    setInterval(() => { setState(states[i = (i + 1) % states.length]); }, 1500);
  }
</script>
</body>
</html>
