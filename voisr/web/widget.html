<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Voisr Recording</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; overflow: hidden; }
  body {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  }
  :root {
    --ease: cubic-bezier(.2, .8, .2, 1);     /* arrivals: the dashboard's own --ease */
    --ease-in: cubic-bezier(.4, 0, 1, 1);    /* departures */
    /* The same dark capsule over light and dark windows: the pill floats over
       other apps, so it doesn't follow Voisr's appearance. */
    --capsule: #191918;
    --on-capsule: #FDFDFC;
    --live: #B8BAFF;
    --live-glow: rgba(154, 157, 255, .75);
  }

  /* ---- the pill: rises in, drops out -----------------------------------
     The panel stays resident at alpha 1 while shown; the pill itself does
     the entrance (220 ms) and exit (160 ms), and Python only fades the panel
     out once the exit has finished. No data-theme attribute = Signature. */
  .pill {
    position: relative;
    flex: none;
    width: 196px;
    height: 44px;
    background: var(--capsule);
    border-radius: 22px;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .14), 0 8px 24px rgba(23, 20, 15, .3);
    color: var(--on-capsule);
    opacity: 0;
    transform: translateY(6px) scale(.94);
    transition: opacity 220ms var(--ease), transform 220ms var(--ease);
  }
  .pill.is-shown {
    opacity: 1;
    transform: none;
    transition: opacity 220ms var(--ease), transform 220ms var(--ease), width 180ms var(--ease);
  }
  .pill.is-leaving {
    opacity: 0;
    transform: translateY(2px) scale(.97);
    transition: opacity 160ms var(--ease-in), transform 160ms var(--ease-in);
  }

  /* ---- the dot: Quiet's only sign that the mic is live ------------------
     Shown only while recording and never recoloured. Signature has no dot, by
     the owner's call after trying it: its moving bars say the same. */
  .dot {
    display: none;
    position: absolute;
    left: 22px;
    top: 8px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--live);
    box-shadow: 0 0 10px 2px var(--live-glow);
    opacity: 0;
    transition: opacity 80ms linear;
  }
  .pill[data-state="recording"] .dot {
    opacity: 1;
    transition: none;
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(.8); opacity: .75; }
    50% { transform: scale(1.15); opacity: 1; }
  }

  /* ---- bars --------------------------------------------------------------
     Live (the default): 26 px bars the page scales per frame from the mic
     level. Loop: a recorder with no meter (the ffmpeg fallback) plays each
     bar's own rhythm. */
  .bars {
    position: absolute;
    left: 53px;
    top: 9px;
    height: 26px;
    display: flex;
    gap: 3px;
  }
  .bar {
    flex: none;
    display: block;
    width: 2.5px;
    height: 26px;
    border-radius: 1.25px;
    background: var(--bar-color, var(--on-capsule));
    transform: scaleY(.2);
  }
  .pill[data-meter="loop"][data-state="recording"] .bar {
    border-radius: 1.25px / calc(1.25px / (var(--peak) * .4));  /* round at its mean height */
    animation: speak var(--d) ease-in-out var(--o) infinite backwards;
  }
  @keyframes speak {
    0%, 100% { transform: scaleY(calc(var(--peak) * .25)); }
    35% { transform: scaleY(var(--peak)); }
    70% { transform: scaleY(calc(var(--peak) * .5)); }
  }

  /* transcribing: bars settle lower (JS) and a dip travels left to right. It
     starts from full opacity, so entering this state doesn't jump. */
  .pill[data-state="processing"] .bar {
    animation: shimmer 1.1s ease-in-out infinite;
    animation-delay: calc(var(--i) * 60ms);
  }
  @keyframes shimmer { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }

  /* ---- done / error: icons over the bars ---- */
  .icon {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    opacity: 0;
    visibility: hidden;
    transition: opacity 120ms linear, visibility 0s linear 120ms;
    pointer-events: none;
  }
  .icon svg { width: 20px; height: 20px; display: block; }
  .pill[data-state="done"] .icon-done,
  .pill[data-state="error"] .icon-error {
    opacity: 1;
    visibility: visible;
    transition: opacity 120ms linear;
  }
  /* words instead of bars, for the rare thing an icon can't say */
  .pill-label {
    position: absolute;
    inset: 0 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12.5px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    opacity: 0;
    visibility: hidden;
    transition: opacity 120ms linear, visibility 0s linear 120ms;
    pointer-events: none;
  }
  .pill-label span { overflow: hidden; text-overflow: ellipsis; }
  .pill[data-state="label"] .pill-label {
    opacity: 1;
    visibility: visible;
    transition: opacity 120ms linear;
  }
  /* the check draws itself once the bars have folded into the centre */
  .icon-done polyline { stroke-dasharray: 24; stroke-dashoffset: 24; }
  .pill[data-state="done"] .icon-done polyline { animation: draw 240ms var(--ease) 120ms forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  /* a small no, not an alarm */
  .pill[data-state="error"] .icon-error { animation: shake 280ms var(--ease); }
  @keyframes shake {
    20% { transform: translateX(-3px); }
    40% { transform: translateX(3px); }
    60% { transform: translateX(-2px); }
    80% { transform: translateX(2px); }
  }

  /* ---- Quiet: the dot alone, three dots while transcribing --------------
     These stay AFTER the rules above: equal specificity, source order decides.
     A label needs more room, so the capsule opens to fit it (JS measures);
     the words wait a moment so they don't show before it has opened. */
  .qdots {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    gap: 3px;
    opacity: 0;
    transition: opacity 120ms linear;
  }
  .qdot {
    display: block;
    width: 3.5px;
    height: 3.5px;
    border-radius: 50%;
    background: var(--bar-color, var(--on-capsule));
  }
  .pill[data-theme="quiet"] { width: 52px; height: 24px; border-radius: 12px; }
  .pill[data-theme="quiet"][data-state="label"] { width: var(--label-w, 140px); }
  .pill[data-theme="quiet"] .dot { display: block; }
  .pill[data-theme="quiet"] .bars { display: none; }
  .pill[data-theme="quiet"] .qdots { display: flex; }
  .pill[data-theme="quiet"][data-state="processing"] .qdots { opacity: 1; }
  .pill[data-theme="quiet"][data-state="processing"] .qdot {
    animation: shimmer 1.1s ease-in-out infinite;
    animation-delay: calc(var(--i) * 120ms);
  }
  .pill[data-theme="quiet"] .icon svg { width: 14px; height: 14px; stroke-width: 2.6; }
  .pill[data-theme="quiet"] .pill-label { font-size: 11.5px; }
  .pill[data-theme="quiet"][data-state="label"] .pill-label { transition: opacity 120ms linear 60ms; }

  /* Reduced motion: nothing moves. The pill fades in and out, bars hold their
     transcribing shape and show the level as brightness (JS), no fold, draw,
     shake or pulse. */
  @media (prefers-reduced-motion: reduce) {
    .pill, .pill.is-shown, .pill.is-leaving { transform: none !important; transition: opacity 120ms linear !important; }
    .dot, .bar, .qdot { animation: none !important; }
    .pill[data-meter="loop"][data-state="recording"] .bar {
      transform: scaleY(var(--hold));
      border-radius: 1.25px / calc(1.25px / var(--hold));
    }
    .pill[data-state="processing"] .bar,
    .pill[data-state="processing"] .qdot { opacity: .6; }
    .icon-done polyline { animation: none !important; stroke-dashoffset: 0; }
    .icon-error { animation: none !important; }
  }
</style>
</head>
<body>
  <div class="pill" id="pill" data-state="idle" data-meter="live" role="status" aria-live="polite">
    <span class="dot" id="dot" aria-hidden="true"></span>
    <span class="bars" id="bars" aria-hidden="true"></span>
    <span class="qdots" aria-hidden="true"><span class="qdot" style="--i:0"></span><span class="qdot" style="--i:1"></span><span class="qdot" style="--i:2"></span></span>
    <span class="icon icon-done" aria-label="Dictation ready">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 9 17 20 6"/></svg>
    </span>
    <div class="pill-label"><span id="pill-label"></span></div>
    <span class="icon icon-error" aria-label="Dictation failed">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </span>
  </div>
<script src="js/meter.js"></script>
<script>
  "use strict";
  const pill = document.getElementById("pill");
  const dot = document.getElementById("dot");
  const label = document.getElementById("pill-label");
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)");
  const M = window.Voisr.meter;

  /* Bar heights as a share of the 26 px bar */
  const HUMP = M.hump(M.PILL_SPEAK.length);
  const REST = HUMP.map((s) => (3 + 3.5 * s) / 26);   // silence: 3-6.5 px
  const HOLD = HUMP.map((s) => (4 + 10 * s) / 26);    // transcribing: 5-14 px
  const PEAK = M.pillWeights();
  const CAP = 1.25;                                   // half the bar's width

  const bars = M.PILL_SPEAK.map(([period, offset], i) => {
    const b = document.createElement("span");
    b.className = "bar";
    b.style.setProperty("--i", i);
    b.style.setProperty("--d", `${period}s`);
    b.style.setProperty("--o", `${offset}s`);
    b.style.setProperty("--peak", PEAK[i].toFixed(3));
    b.style.setProperty("--hold", HOLD[i].toFixed(3));
    return document.getElementById("bars").appendChild(b);
  });
  const moving = [dot, ...bars, ...pill.querySelectorAll(".qdot")];

  /* No setLevel within this long of "recording" means the recorder has no
     meter (the ffmpeg fallback): play the decorative loop instead. Python's
     first push lands in the same run-loop turn as setState, so a metered
     recording never waits on this. */
  const METER_GRACE_MS = 150;
  /* Outlasts the pill's 160 ms exit. Then the state goes back to idle, which
     no animation rule matches: this panel stays resident, and a hidden pill
     must not keep the dot pulsing. */
  const SETTLE_MS = 170;
  const LABEL_PADDING = 31;   // a short label comes to the design's 140 px
  const SIGNATURE_WIDTH = 196;
  const QUIET_WIDTH = 52;

  let state = "idle";        // last state set; "idle" once hidden
  let theme = "classic";
  const meter = M.createPill();
  let metered = false;
  let loopTimer = 0;
  let settleTimer = 0;
  let raf = 0;
  let last = 0;

  const isQuiet = () => theme === "quiet";

  function clearBars() {
    for (const b of bars) {
      b.style.transition = "";
      b.style.transform = "";
      b.style.borderRadius = "";
      b.style.opacity = "";
    }
  }

  function restBars() {
    clearBars();
    bars.forEach((b, i) => {
      b.style.transition = "none";
      M.paintBar(b, reduced.matches ? HOLD[i] : REST[i], CAP);
      if (reduced.matches) b.style.opacity = ".35";  // a frame's reading of silence
    });
  }

  function frame(now) {
    raf = 0;
    if (state !== "recording" || pill.dataset.meter !== "live" || isQuiet()) return;
    const dt = Math.min(64, now - last);  // a stalled frame must not jump the envelope
    last = now;
    meter.frame(dt, now).forEach((x, i) => {
      const b = bars[i];
      if (reduced.matches) {
        M.paintBar(b, HOLD[i], CAP);
        b.style.opacity = (.35 + .65 * x).toFixed(3);
        return;
      }
      M.paintBar(b, REST[i] + (1 - REST[i]) * x, CAP);
    });
    // parked in silence; the next sound through setLevel starts frames again
    if (!meter.atRest()) raf = requestAnimationFrame(frame);
  }

  function startFrames() {
    if (raf) return;
    last = performance.now();
    raf = requestAnimationFrame(frame);
  }

  function stopFrames() {
    if (raf) cancelAnimationFrame(raf);
    raf = 0;
  }

  /* Restart the CSS animations from frame 0.
     The pill's window is hidden between dictations, and a hidden WebView2
     throttles its animations; one that was running when it was hidden is not
     reliably resumed when the window shows again, so the pulse or the shimmer
     can appear frozen. Re-applying the animation guarantees it plays. */
  function kick() {
    for (const el of moving) el.style.animation = "none";
    void pill.offsetWidth;            // reflow so the removal takes effect
    for (const el of moving) el.style.animation = "";
  }

  function show() {
    if (pill.classList.contains("is-shown")) return;
    pill.classList.remove("is-leaving");
    void pill.offsetWidth;            // start the entrance from the hidden pose
    pill.classList.add("is-shown");
  }

  function setState(next) {
    state = next;
    pill.dataset.state = next;
    clearTimeout(loopTimer);
    clearTimeout(settleTimer);
    if (next === "recording") {
      meter.reset();
      metered = false;
      pill.dataset.meter = "live";
      restBars();
      loopTimer = setTimeout(() => {
        if (state === "recording" && !metered) {
          pill.dataset.meter = "loop";
          clearBars();
          kick();
        }
      }, METER_GRACE_MS);
    } else {
      stopFrames();
      // processing, done and error speak the same grammar either way
      pill.dataset.meter = "live";
      const still = reduced.matches;
      bars.forEach((b, i) => {
        b.style.opacity = "";
        if (next === "processing") {
          b.style.transition = still ? "none" : "transform 180ms var(--ease)";
          M.paintBar(b, HOLD[i], CAP);
        } else {
          // done folds the bars into the centre; error just lets them go
          const fold = next === "done" && !still;
          b.style.transition = fold
            ? "transform 180ms var(--ease-in), opacity 150ms linear"
            : "opacity 120ms linear";
          if (fold) b.style.transform = `translateX(${(8 - i) * 5.5}px) scaleY(.2)`;
          b.style.opacity = "0";
        }
      });
    }
    show();
    kick();
  }
  window.setState = setState;

  /* textContent: the label can hold a word from the user's own text. Quiet
     opens to fit the words, up to Signature's width; Signature stays put. */
  window.setLabel = (text) => {
    label.textContent = text;
    const width = Math.ceil(label.scrollWidth) + LABEL_PADDING;
    pill.style.setProperty("--label-w",
      `${Math.max(QUIET_WIDTH, Math.min(SIGNATURE_WIDTH, width))}px`);
  };

  function hide() {
    state = "idle";
    clearTimeout(loopTimer);
    clearTimeout(settleTimer);
    stopFrames();
    pill.classList.add("is-leaving");
    pill.classList.remove("is-shown");
    settleTimer = setTimeout(() => { pill.dataset.state = "idle"; }, SETTLE_MS);
  }
  window.hide = hide;

  /* 0..1 from Python's 30 Hz feed; the meter smooths between pushes */
  function setLevel(level) {
    meter.setLevel(level);
    if (state !== "recording") return;
    metered = true;
    clearTimeout(loopTimer);
    if (pill.dataset.meter !== "live") {
      pill.dataset.meter = "live";
      restBars();
    }
    // Quiet has no bars to draw it with, and settled silence has nothing to draw
    if (!isQuiet() && !meter.atRest()) startFrames();
  }
  window.setLevel = setLevel;

  const THEME_VALUES = ["classic", "quiet"];
  function setTheme(next) {
    /* classic/unknown = no attribute; base CSS renders Signature */
    theme = THEME_VALUES.includes(next) ? next : "classic";
    if (theme !== "classic") pill.dataset.theme = theme;
    else delete pill.dataset.theme;
  }
  window.setTheme = setTheme;

  const HEX_RE = /^#[0-9A-Fa-f]{6}$/;
  function setColor(hex) {
    /* null/invalid = the design's near-white. Never the live dot. */
    if (typeof hex === "string" && HEX_RE.test(hex)) pill.style.setProperty("--bar-color", hex);
    else pill.style.removeProperty("--bar-color");
  }
  window.setColor = setColor;

  /* The page flips back to "visible" the moment the window is shown again:
     re-kick then so the pulse is never stuck at its first frame. */
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") kick();
  });

  /* ---- browser QA ------------------------------------------------------
     widget.html?theme=quiet           shows a theme, metered by a simulated voice
     widget.html?color=%237DE3C0       previews a custom color
     widget.html?preview               cycles every state
     widget.html?loop                  forces the unmetered fallback */
  const params = new URLSearchParams(location.search);
  if (params.get("theme")) setTheme(params.get("theme"));
  if (params.get("color")) setColor(params.get("color"));
  if (params.has("theme") || params.has("color") || params.has("preview") || params.has("loop")) {
    let syllableEnd = 0, gapEnd = 0, amp = 0;
    const simulated = () => {
      const now = performance.now();
      if (now > gapEnd) { amp = .4 + Math.random() * .6; syllableEnd = now + 110 + Math.random() * 170; gapEnd = syllableEnd + (Math.random() < .16 ? 400 : 60); }
      return now < syllableEnd ? amp * (.9 + Math.random() * .2) : .02;
    };
    if (!params.has("loop")) setInterval(() => { if (state === "recording") setLevel(simulated()); }, 1000 / 30);
    setState("recording");
    if (params.has("preview")) {
      window.setLabel("Copied — press Ctrl+V");
      const steps = [["processing", 2600], ["done", 800], ["hide", 1400], ["label", 1800], ["hide", 1400], ["error", 800], ["hide", 1400], ["recording", 2600]];
      let i = 0;
      const next = () => {
        const [name, wait] = steps[i++ % steps.length];
        name === "hide" ? hide() : setState(name);
        setTimeout(next, wait);
      };
      setTimeout(next, 2600);
    }
  }
</script>
</body>
</html>
