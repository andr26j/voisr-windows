<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Voisr Recording</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; overflow: hidden; }
  body {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  }
  :root {
    --ease: cubic-bezier(.2, .8, .2, 1);     /* arrivals: the dashboard's own --ease */
    --ease-in: cubic-bezier(.4, 0, 1, 1);    /* departures */
  }

  /* ---- the pill: rises in, drops out -----------------------------------
     The panel stays resident at alpha 1 while shown; the pill itself does
     the entrance (220 ms) and exit (160 ms), and Python only fades the panel
     out once the exit has finished. */
  .pill {
    position: relative;
    width: 220px;
    height: 44px;
    background: rgba(28, 26, 23, 0.94);
    border-radius: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    opacity: 0;
    transform: translateY(6px) scale(.94);
    transition: opacity 220ms var(--ease), transform 220ms var(--ease);
  }
  .pill.is-shown { opacity: 1; transform: none; }
  .pill.is-leaving {
    opacity: 0;
    transform: translateY(2px) scale(.97);
    transition: opacity 160ms var(--ease-in), transform 160ms var(--ease-in);
  }

  /* ---- bars --------------------------------------------------------------
     Live (the default): 26 px bars the page scales per frame from the mic
     level, 30% at rest. Loop: a recorder with no meter (the ffmpeg
     fallback) gets the decorative keyframes it always had. */
  .bar {
    flex: none;
    width: 4px;
    height: 26px;
    border-radius: 2px;
    background: var(--bar-color, #FFFFFF);
    opacity: 0.9;
    transform: scaleY(.3);
  }
  .pill[data-meter="loop"] .bar { height: 8px; transform: none; }

  /* transcribing: bars settle to half height (JS), a highlight travels left to right */
  .pill[data-state="processing"] .bar {
    animation: shimmer 1.1s ease-in-out infinite;
    animation-delay: calc(var(--i) * 70ms);
  }
  @keyframes shimmer { 0%, 100% { opacity: .35; } 50% { opacity: .95; } }

  /* ---- loop fallback: today's waveform, unchanged ---- */
  .pill[data-meter="loop"][data-state="recording"] .bar { animation: wave 1s ease-in-out infinite; animation-delay: calc(var(--i) * .15s); }
  @keyframes wave {
    0%, 100% { height: 8px; }
    50% { height: 26px; }
  }

  /* ---- done / error: icons over the bars ---- */
  .icon {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    opacity: 0;
    visibility: hidden;
    transition: opacity 120ms linear, visibility 0s linear 120ms;
    pointer-events: none;
  }
  .icon svg { width: 20px; height: 20px; display: block; }
  .pill[data-state="done"] .icon-done,
  .pill[data-state="error"] .icon-error {
    opacity: 1;
    visibility: visible;
    transition: opacity 120ms linear;
  }
  /* the check draws itself once the bars have folded into the centre */
  .icon-done polyline { stroke-dasharray: 24; stroke-dashoffset: 24; }
  .pill[data-state="done"] .icon-done polyline { animation: draw 240ms var(--ease) 120ms forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  /* a small no, not an alarm */
  .pill[data-state="error"] .icon-error { animation: shake 280ms var(--ease); }
  @keyframes shake {
    20% { transform: translateX(-3px); }
    40% { transform: translateX(3px); }
    60% { transform: translateX(-2px); }
    80% { transform: translateX(2px); }
  }

  /* ---- themes ----------------------------------------------------------
     Colour (and Scanner's dot shape) applies in ALL states and meter modes —
     theme rules must stay AFTER the rules above (equal specificity, source
     order decides). Live metering shapes each theme in js/meter.js; the
     signature keyframes below play only in the loop fallback. Overrides use
     longhand animation-* properties so the --i stagger delay keeps applying
     (the shorthand would reset it). No data-theme attribute (or an unknown
     one) = Classic, purely by CSS fallthrough. */
  .pill[data-theme="ember"] .bar { background: var(--bar-color, #E8643C); box-shadow: 0 0 6px var(--bar-glow, rgba(232, 100, 60, .8)); }
  .pill[data-meter="loop"][data-state="recording"][data-theme="ember"] .bar {
    animation-name: flick; animation-duration: .9s;
  }

  .pill[data-theme="aurora"] .bar { background: var(--bar-color, linear-gradient(180deg, #4ADEDE, #9B5DE5)); }
  .pill[data-meter="live"][data-state="recording"][data-theme="aurora"] .bar {
    animation: hue 3s linear infinite;
  }
  .pill[data-meter="loop"][data-state="recording"][data-theme="aurora"] .bar {
    animation-name: wave, hue; animation-duration: 1.1s, 3s;
    animation-timing-function: ease-in-out, linear;
  }
  /* a custom color must not drift through the spectrum: drop the hue-rotate
     animation while --bar-color is set (data-custom-color mirrors it) */
  .pill[data-custom-color][data-meter="live"][data-state="recording"][data-theme="aurora"] .bar {
    animation: none;
  }
  .pill[data-custom-color][data-meter="loop"][data-state="recording"][data-theme="aurora"] .bar {
    animation-name: wave; animation-duration: 1.1s;
    animation-timing-function: ease-in-out;
  }

  .pill[data-theme="ocean"] .bar { background: var(--bar-color, #5AA9E6); }
  .pill[data-meter="loop"][data-state="recording"][data-theme="ocean"] .bar {
    animation-name: swell; animation-duration: 1.8s;
  }

  .pill[data-theme="neon"] .bar { background: var(--bar-color, #39FF88); box-shadow: 0 0 7px var(--bar-glow, rgba(57, 255, 136, .75)); }
  .pill[data-meter="loop"][data-state="recording"][data-theme="neon"] .bar {
    animation-name: eq; animation-duration: .7s;
    animation-timing-function: steps(3, end);
  }

  .pill[data-theme="breathe"] .bar { background: var(--bar-color, #A8E6CF); }
  .pill[data-meter="loop"][data-state="recording"][data-theme="breathe"] .bar {
    animation-name: breathe; animation-duration: 1.6s;
    animation-delay: 0s; /* one synchronized pulse, no stagger */
  }

  /* Scanner never grows: brightness carries the level */
  .pill[data-theme="scanner"] .bar {
    background: var(--bar-color, #EDEDED); width: 6px; height: 6px; border-radius: 3px; opacity: .18; transform: none;
  }
  .pill[data-meter="loop"][data-state="recording"][data-theme="scanner"] .bar {
    animation-name: scan; animation-duration: 1.2s;
    animation-timing-function: linear;
  }

  @keyframes flick   { 0%, 100% { height: 8px; } 35% { height: 24px; } 60% { height: 14px; } 80% { height: 22px; } }
  @keyframes hue     { from { filter: hue-rotate(0deg); } to { filter: hue-rotate(360deg); } }
  @keyframes swell   { 0%, 100% { height: 6px; opacity: .65; } 50% { height: 22px; opacity: 1; } }
  @keyframes eq      { 0% { height: 6px; } 25% { height: 24px; } 50% { height: 10px; } 75% { height: 20px; } 100% { height: 6px; } }
  @keyframes breathe { 0%, 100% { transform: scaleY(.5); opacity: .45; } 50% { transform: scaleY(1.4); opacity: 1; } }
  @keyframes scan    { 0%, 20% { opacity: 1; } 40%, 100% { opacity: .18; } }

  /* Reduced motion: nothing moves. The pill fades in and out, bars hold at
     half height and show the level as brightness (JS), no fold, draw or shake. */
  @media (prefers-reduced-motion: reduce) {
    .pill, .pill.is-shown, .pill.is-leaving { transform: none !important; transition: opacity 120ms linear !important; }
    .bar { animation: none !important; }
    .pill[data-state="processing"] .bar { opacity: .6; }
    .pill[data-meter="loop"] .bar { height: 14px !important; }
    /* scanner's resting opacity is animation-driven in the loop; restore
       visibility (and keep the dots dot-shaped rather than 14px capsules) */
    .pill[data-meter="loop"][data-theme="scanner"] .bar { opacity: .9 !important; height: 6px !important; }
    .icon-done polyline { animation: none !important; stroke-dashoffset: 0; }
    .icon-error { animation: none !important; }
  }
</style>
</head>
<body>
  <div class="pill" id="pill" data-state="idle" data-meter="live" role="status" aria-live="polite">
    <span class="bar" style="--i:0"></span><span class="bar" style="--i:1"></span><span class="bar" style="--i:2"></span><span class="bar" style="--i:3"></span>
    <span class="bar" style="--i:4"></span><span class="bar" style="--i:5"></span><span class="bar" style="--i:6"></span>
    <span class="icon icon-done" aria-label="Dictation ready">
      <svg viewBox="0 0 24 24" fill="none" stroke="#7FD19A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 9 17 20 6"/></svg>
    </span>
    <span class="icon icon-error" aria-label="Dictation failed">
      <svg viewBox="0 0 24 24" fill="none" stroke="#F08C72" stroke-width="3" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="14"/><circle cx="12" cy="19" r="1.4" fill="#F08C72" stroke="none"/></svg>
    </span>
  </div>
<script src="js/meter.js"></script>
<script>
  "use strict";
  const pill = document.getElementById("pill");
  const bars = [...pill.querySelectorAll(".bar")];
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)");

  /* No setLevel within this long of "recording" means the recorder has no
     meter (the ffmpeg fallback): play the decorative loop instead. Python's
     first push lands in the same run-loop turn as setState, so a metered
     recording never waits on this. */
  const METER_GRACE_MS = 150;

  let state = "idle";        // last state set; "idle" once hidden
  let theme = "classic";
  let meter = window.Voisr.meter.create(bars.length, theme);
  let metered = false;
  let loopTimer = 0;
  let raf = 0;
  let last = 0;

  const isScanner = () => theme === "scanner";
  const restScale = () => (theme === "breathe" ? .4 : .3);

  const paintBar = window.Voisr.meter.paintBar;  // scaleY with round caps

  function clearBars() {
    for (const b of bars) {
      b.style.transition = "";
      b.style.transform = "";
      b.style.borderRadius = "";
      b.style.opacity = "";
    }
  }

  function restBars() {
    clearBars();
    for (const b of bars) {
      b.style.transition = "none";
      if (!isScanner()) paintBar(b, restScale());
    }
  }

  function frame(now) {
    raf = 0;
    if (state !== "recording" || pill.dataset.meter !== "live") return;
    const dt = Math.min(64, now - last);  // a stalled frame must not jump the envelope
    last = now;
    const levels = meter.frame(dt, now);
    const rest = restScale();
    levels.forEach((x, i) => {
      const b = bars[i];
      if (isScanner()) { b.style.opacity = (.18 + .82 * x).toFixed(3); return; }
      if (reduced.matches) {
        paintBar(b, .5);
        b.style.opacity = (.35 + .65 * x).toFixed(3);
        return;
      }
      paintBar(b, rest + (1 - rest) * x);
    });
    // parked in silence; the next setLevel starts frames again
    if (!meter.atRest()) raf = requestAnimationFrame(frame);
  }

  function startFrames() {
    if (raf) return;
    last = performance.now();
    raf = requestAnimationFrame(frame);
  }

  function stopFrames() {
    if (raf) cancelAnimationFrame(raf);
    raf = 0;
  }

  /* Restart the CSS animations from frame 0.
     WebKit pauses a WKWebView's animations while its window is occluded —
     which is exactly what happens when the pill is ordered over another
     app's fullscreen Space — and does not reliably resume an already-running
     animation when the window becomes visible again, so the shimmer (or the
     loop fallback) can appear frozen. Re-applying the animation guarantees
     it plays. */
  function kick() {
    for (const b of bars) b.style.animation = "none";
    void pill.offsetWidth;            // reflow so the removal takes effect
    for (const b of bars) b.style.animation = "";
  }

  function show() {
    if (pill.classList.contains("is-shown")) return;
    pill.classList.remove("is-leaving");
    void pill.offsetWidth;            // start the entrance from the hidden pose
    pill.classList.add("is-shown");
  }

  function setState(next) {
    state = next;
    pill.dataset.state = next;
    clearTimeout(loopTimer);
    if (next === "recording") {
      meter.reset();
      metered = false;
      pill.dataset.meter = "live";
      restBars();
      loopTimer = setTimeout(() => {
        if (state === "recording" && !metered) {
          pill.dataset.meter = "loop";
          clearBars();
          kick();
        }
      }, METER_GRACE_MS);
    } else {
      stopFrames();
      // processing, done and error speak the same grammar either way
      pill.dataset.meter = "live";
      const still = reduced.matches;
      bars.forEach((b, i) => {
        b.style.opacity = "";
        if (next === "processing") {
          b.style.transition = still ? "none" : "transform 180ms var(--ease)";
          if (!isScanner()) paintBar(b, .5);
        } else {
          // done folds the bars into the centre; error just lets them go
          const fold = next === "done" && !still;
          b.style.transition = fold
            ? "transform 180ms var(--ease-in), opacity 150ms linear"
            : "opacity 120ms linear";
          if (fold) b.style.transform = `translateX(${(3 - i) * (isScanner() ? 11 : 9)}px) scaleY(.2)`;
          b.style.opacity = "0";
        }
      });
    }
    show();
    kick();
  }
  window.setState = setState;

  function hide() {
    state = "idle";
    clearTimeout(loopTimer);
    stopFrames();
    pill.classList.add("is-leaving");
    pill.classList.remove("is-shown");
  }
  window.hide = hide;

  /* 0..1 from Python's 30 Hz feed; the meter smooths between pushes */
  function setLevel(level) {
    meter.setLevel(level);
    if (state !== "recording") return;
    metered = true;
    clearTimeout(loopTimer);
    if (pill.dataset.meter !== "live") {
      pill.dataset.meter = "live";
      restBars();
    }
    startFrames();
  }
  window.setLevel = setLevel;

  const THEME_VALUES = ["classic", "ember", "aurora", "ocean", "neon", "breathe", "scanner"];
  function setTheme(next) {
    /* classic/unknown = no attribute; base CSS renders the Classic look */
    theme = THEME_VALUES.includes(next) ? next : "classic";
    if (theme !== "classic") pill.dataset.theme = theme;
    else delete pill.dataset.theme;
    meter = window.Voisr.meter.create(bars.length, theme);
    if (state === "recording" && pill.dataset.meter === "live") restBars();
    kick();
  }
  window.setTheme = setTheme;

  const HEX_RE = /^#[0-9A-Fa-f]{6}$/;
  function setColor(hex) {
    /* null/invalid = theme's designed color (the CSS var() fallbacks) */
    if (typeof hex === "string" && HEX_RE.test(hex)) {
      pill.style.setProperty("--bar-color", hex);
      const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16),
            b = parseInt(hex.slice(5, 7), 16);
      pill.style.setProperty("--bar-glow", `rgba(${r}, ${g}, ${b}, .75)`);
      pill.dataset.customColor = "";
    } else {
      pill.style.removeProperty("--bar-color");
      pill.style.removeProperty("--bar-glow");
      delete pill.dataset.customColor;
    }
    kick();
  }
  window.setColor = setColor;

  /* WebKit flips the page back to "visible" the moment the panel is shown
     over a fullscreen app — re-kick then so the shimmer is never stuck at
     its first frame after appearing. */
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") kick();
  });

  /* ---- browser QA ------------------------------------------------------
     widget.html?theme=ember           shows a theme, metered by a simulated voice
     widget.html?theme=aurora&color=%23FF0080   previews a custom color
     widget.html?preview               cycles recording, processing, done, error
     widget.html?loop                  forces the unmetered fallback */
  const params = new URLSearchParams(location.search);
  if (params.get("theme")) setTheme(params.get("theme"));
  if (params.get("color")) setColor(params.get("color"));
  if (params.has("theme") || params.has("color") || params.has("preview") || params.has("loop")) {
    let syllableEnd = 0, gapEnd = 0, amp = 0;
    const simulated = () => {
      const now = performance.now();
      if (now > gapEnd) { amp = .4 + Math.random() * .6; syllableEnd = now + 110 + Math.random() * 170; gapEnd = syllableEnd + (Math.random() < .16 ? 400 : 60); }
      return now < syllableEnd ? amp * (.9 + Math.random() * .2) : .02;
    };
    if (!params.has("loop")) setInterval(() => { if (state === "recording") setLevel(simulated()); }, 1000 / 30);
    setState("recording");
    if (params.has("preview")) {
      const steps = [["processing", 2600], ["done", 800], ["hide", 1400], ["error", 800], ["hide", 1400], ["recording", 600]];
      let i = 0;
      const next = () => {
        const [name, wait] = steps[i++ % steps.length];
        name === "hide" ? hide() : setState(name);
        setTimeout(next, wait);
      };
      setTimeout(next, 2600);
    }
  }
</script>
</body>
</html>
