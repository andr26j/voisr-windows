name: windows

# Tests run on every push to main or a port/ branch and on pull requests.
# The installer is built on main, on a v* tag, and on a manual run, so a
# port branch can ask for a build with "Run workflow" without paying six
# minutes on every push.
on:
  push:
    branches: [main, "port/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      notes:
        description: Release notes baked into latest.json
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -m "not slow" -q -p no:cacheprovider -rs --durations=15

  build:
    needs: test
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache the Whisper model
        uses: actions/cache@v4
        with:
          path: models
          key: whisper-models-base-en-v1

      - name: Create the build venv
        run: |
          python -m venv venv
          venv\Scripts\python.exe -m pip install -q --upgrade pip
          venv\Scripts\python.exe -m pip install -q -r requirements.txt -r requirements-build.txt

      - name: Install Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build VoisrSetup.exe
        env:
          VOISR_RELEASE_NOTES: ${{ github.event.inputs.notes || format('Build of {0}', github.sha) }}
        run: .\scripts\build_release.ps1

      - name: Smoke test the frozen app
        run: |
          # build/entry.py's --self-test imports every module the frozen app
          # ships and checks its bundled files, then exits without opening a
          # window, hooking the keyboard or touching the microphone.
          $report = Join-Path $env:RUNNER_TEMP "selftest.txt"
          $p = Start-Process -FilePath build\dist\Voisr\Voisr.exe -ArgumentList "--self-test", "`"$report`"" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "Voisr.exe --self-test hung for 2 minutes" }
          if (Test-Path $report) { Get-Content $report }
          if ($p.ExitCode -ne 0) { throw "Voisr.exe --self-test exited $($p.ExitCode)" }

      - uses: actions/upload-artifact@v4
        with:
          name: VoisrSetup
          path: |
            build/Output/VoisrSetup.exe
            build/Output/latest.json
          if-no-files-found: error
